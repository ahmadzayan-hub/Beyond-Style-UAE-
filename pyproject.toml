[project]
name = "bsos"
version = "0.1.0"
description = "Beyond Style Agentic OS — kernel-enforced pipeline from market signal to shippable product"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlmodel>=0.0.16",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pillow>=10.0",
    "imagehash>=4.3",
    "pyyaml>=6.0",
    "fpdf2>=2.7",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "python-dotenv>=1.0",
    "prometheus-client>=0.20",
    "alembic>=1.13",
    "uharfbuzz>=0.39",
    "fonttools>=4.50",
    "shapely>=2.0",
    "ezdxf>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
magic = ["python-magic>=0.4"]
clip = ["open-clip-torch>=2.24", "torch>=2.2"]
video = ["imageio[pyav]>=2.34"]

[project.scripts]
bsos = "bsos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bsos*"]

[tool.setuptools.package-data]
bsos = ["kernel/policies.yaml", "agents/prompts/*.md", "knowledge/*.md",
        "design_studio/registry.json", "design_studio/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
